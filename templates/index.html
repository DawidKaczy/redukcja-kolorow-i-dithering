<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wczytaj obraz</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-image: url('../static/uploads/tlo.png');
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
    }

    .container {
        background-image: url('../static/uploads/tlov2.png');
        background-position: center;
        background-size: 475% auto;
        padding: 2rem;
        border: 2px solid white;
        border-radius: 20px;
        box-shadow: 10px 10px 8px rgba(255,255,255,1);
        width: 100%;
        max-width: 400px;
    }

    h1 {
        margin-bottom: 1.5rem;
        font-size: 2rem;
        color: white;
        padding-bottom: 15px;
        font-family: Arial, Helvetica, sans-serif;
        -webkit-text-stroke: 1px black;
    }

    label[for="obraz"] {
        color: white;
        font-size: 18px;
        -webkit-text-stroke: 0.1px black;
        padding: 5px;
        font-weight: bold;
    }

    label[for="slider"] {
        color: white;
        font-size: 18px;
        -webkit-text-stroke: 0.1px black;
        padding: 5px;
        font-weight: bold;
    }

    .form-group {
        margin-bottom: 1.5rem;
        text-align: left;
    }

    label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        font-size: 0.9rem;
    }

    input[type="file"] {
        width: 100%;
        padding: 20px 50px 80px 50px;
        background-color: rgba(255, 255, 255, 0.2);
        border: 2px ridge white;
        border-radius: 8px;
        cursor: pointer;
        transition: border-color 0.3s;

    }

    input[type="file"]::file-selector-button{
        padding: 8px 14px;
        border-radius: 8px;
        border-color: #BBBBBD;
        background-color: rgba(0, 0, 0, 0.5);
        -webkit-text-stroke: 0.2px black;
        color: white;
        font-weight: 600;
        cursor: pointer;
    }

    input[type="file"]::file-selector-button:hover {
        border-color: #00FC47;

    }


    input[type="file"]:hover {
        border-color: #00FC47;
    }

    .slider-container {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    input[type="range"] {
        flex-grow: 1;
        cursor: pointer;
        accent-color: #00FC47;

    }

    input[type="number"] {
        width: 60px;
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 8px;
        text-align: center;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #00FC47;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.1s;
        margin-top: 1rem;
    }

    button:hover {
        background-color: #00FC47;
    }

    button:active {
        transform: scale(0.8);
    }

    button:disabled {
        background-color: rgba(255, 255, 255, 0.5);
        cursor: not-allowed;
    }

</style>
</head>
<body>

<div class="container">
    <h1>Wczytaj obraz</h1>

    <form method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label for="obraz">Prześlij obraz lub przeciągnij:</label>
            <input type="file" name="obraz" id="obraz" accept="image/*" required>

        </div>

        <div class="form-group">
            <label for="slider">Ilość kolorów:</label>
            <div class="slider-container">
                <input type="range" id="slider" name="slider_value" min="2" max="255" value="4">
                <input type="number" id="numberInput" value="4" min="2" max="255">
            </div>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 15px;">
            <input type="checkbox" id="szum" name="dodaj_szum" style="width: 20px; height: 20px; cursor: pointer; accent-color: #00FC47;">
            <label for="szum" style="margin-bottom: 0; cursor: pointer; color: white">Dodaj szum</label>
        </div>
        <button type="submit" id="submit-btn" disabled>Convert</button>
    </form>
</div>

<script>
    const fileInput = document.getElementById('obraz');
    const submitBtn = document.getElementById('submit-btn');

    fileInput.addEventListener('change', function() {
        submitBtn.disabled = !fileInput.files.length;
    });

    const slider = document.getElementById('slider');
    const numberInput = document.getElementById('numberInput');

    slider.addEventListener('input', function() {
        numberInput.value = slider.value;
    });

    numberInput.addEventListener('input', function() {
        let value = parseInt(numberInput.value);
        if (isNaN(value)) value = 2;
        if (value < 2) value = 2;
        if (value > 255) value = 255;

        slider.value = value;
    });

    numberInput.addEventListener('blur', function() {
        let value = parseInt(numberInput.value);
        if (value < 2) value = 2;
        if (value > 255) value = 255;
        numberInput.value = value;
        slider.value = value;
    });
</script>

</body>
</html>
